name: HyperFusionX - Ultra (KSUN) Kernel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Select the branch to build"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - nova
          - ultra-ksu
          - ultra
          - zenith-ksu

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: 🧰 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip bc bison flex \
            libssl-dev libelf-dev \
            ccache build-essential libncurses5-dev

      - name: 🧹 Fix Workspace Permissions
        run: |
          sudo chown -R runner:runner $GITHUB_WORKSPACE
          mkdir -p $GITHUB_WORKSPACE/out
          chmod 755 $GITHUB_WORKSPACE/out

      - name: 🛠 Make Build Script Executable
        run: chmod +x build.sh

      - name: 🚀 Run Kernel Build
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./build.sh

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperFusionX-Kernel
          path: /home/runner/AnyKernel3/*.zip
